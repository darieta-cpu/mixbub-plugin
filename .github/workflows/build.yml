name: Build MasterChain

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DMC_COPY=FALSE

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Sign (ad-hoc) and package
        run: |
          mkdir dist
          VST3=$(find build -name "MasterChain.vst3" -type d | head -n 1)
          AU=$(find build -name "MasterChain.component" -type d | head -n 1)
          echo "VST3: $VST3"; echo "AU: $AU"
          codesign --force --deep -s - "$VST3"
          codesign --force --deep -s - "$AU"
          lipo -archs "$VST3/Contents/MacOS/MasterChain"
          ditto -c -k --keepParent "$VST3" dist/MasterChain-VST3.zip
          ditto -c -k --keepParent "$AU" dist/MasterChain-AU.zip

      - uses: actions/upload-artifact@v4
        with:
          name: MasterChain-macOS
          path: dist/*.zip

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -B build -DMC_COPY=FALSE

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path dist | Out-Null
          $vst3 = Get-ChildItem -Path build -Recurse -Directory -Filter "MasterChain.vst3" | Select-Object -First 1
          if (-not $vst3) { $vst3 = Get-ChildItem -Path build -Recurse -File -Filter "MasterChain.vst3" | Select-Object -First 1 }
          Write-Host "VST3: $($vst3.FullName)"
          Compress-Archive -Path $vst3.FullName -DestinationPath dist/MasterChain-VST3-Windows.zip

      - uses: actions/upload-artifact@v4
        with:
          name: MasterChain-Windows
          path: dist/*.zip
