name: Build Mixbus Chain

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DMC_COPY=FALSE

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Sign (ad-hoc) and package
        run: |
          mkdir dist
          VST3=$(find build -name "*.vst3" -type d | head -n 1)
          AU=$(find build -name "*.component" -type d | head -n 1)
          echo "VST3: $VST3"; echo "AU: $AU"
          codesign --force --deep -s - "$VST3"
          codesign --force --deep -s - "$AU"
          lipo -archs "$(find "$VST3/Contents/MacOS" -type f | head -n 1)"
          ditto -c -k --keepParent "$VST3" dist/MixbusChain-VST3.zip
          ditto -c -k --keepParent "$AU" dist/MixbusChain-AU.zip

      - uses: actions/upload-artifact@v6
        with:
          name: MixbusChain-macOS
          path: dist/*.zip

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6

      - name: Configure
        run: cmake -B build -DMC_COPY=FALSE

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path dist | Out-Null
          New-Item -ItemType Directory -Path payload | Out-Null
          $vst3 = Get-ChildItem -Path build -Recurse -Directory -Filter "*.vst3" | Select-Object -First 1
          if (-not $vst3) { throw "Cartella .vst3 non trovata" }
          Write-Host "VST3: $($vst3.FullName)"
          Copy-Item -Path $vst3.FullName -Destination "payload\Mixbus Chain.vst3" -Recurse
          Compress-Archive -Path $vst3.FullName -DestinationPath dist/MixbusChain-VST3-Windows.zip

      - name: Build installer
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer.iss

      - uses: actions/upload-artifact@v6
        with:
          name: MixbusChain-Windows
          path: |
            output/MixbusChain-Setup.exe
            dist/*.zip
